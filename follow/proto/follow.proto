syntax = "proto3";
package followservice;

option go_package = "./proto/pb";

service FollowService {

    rpc ToggleFollow(FollowRequest) returns (FollowResponse);
    rpc GetUserFollowers(GetUserFollowersRequest) returns (GetUserFollowersResponse);
    rpc GetUserFollowings(GetUserFollowingsRequest) returns (GetUserFollowingsResponse);
}

message FollowRequest {

    bool follow = 1;
    int64 follower_id = 2;
    int64 following_id = 3;
}

message FollowResponse {
    
    string message = 1;


}

message Follow {

   int64 follower_id  = 1;
   int64  following_id  =2;
   int64 id = 3;


}

message GetUserFollowersRequest {

    int64 following_id  = 1;
    int64 limit = 2;
    string cursor = 3;



    
}


message GetUserFollowersResponse {

    repeated Follow followers  = 1;
    bool has_next  = 2;
    int64 limit = 3;
    string cursor  = 4;


    
}


message GetUserFollowingsRequest {

    int64 follower_id = 1;
    int64 limit = 2;
    string cursor = 3;
}

message GetUserFollowingsResponse {

    repeated Follow Followings = 1;
    bool has_next  = 2;
    int64 limit = 3;
    string cursor  = 4;


}