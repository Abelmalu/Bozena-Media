services:
  # ---------------- Infrastructure db,redis,kafka,minio ----------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password@123
      POSTGRES_DB: user_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./psql-init-script:/docker-entrypoint-initdb.d 
    networks:
      - bozena_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    networks:
      - bozena_network

  mongodb:
    image: mongo:6.0
    container_name: mongodb_db
    environment:
      MONGO_INITDB_DATABASE: chat_db
    volumes:
      - mongo_data:/data/db
    networks:
      - bozena_network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: minio_server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    networks:
      - bozena_network
    command: server /data --console-address ":9001"


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    healthcheck:
      test:
          [
           "CMD-SHELL",
           "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"
          ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
      
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - bozena_network

  # ----------------migration runners 

  auth-migration:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy 
    volumes:
      - ./Auth/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://user:password%40123@postgres_db:5432/user_db?sslmode=disable", "up"]
    networks:
      - bozena_network

  post-migration:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy 
    volumes:
      - ./post/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://user:password%40123@postgres_db:5432/post_db?sslmode=disable", "up"]
    networks:
      - bozena_network

  
  like-migration:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy 
    volumes:
      - ./like/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://user:password%40123@postgres_db:5432/like_db?sslmode=disable", "up"]
    networks:
      - bozena_network



  follow-migration:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy 
    volumes:
      - ./follow/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://user:password%40123@postgres_db:5432/follow_db?sslmode=disable", "up"]
    networks:
      - bozena_network


  feed-migration:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy 
    volumes:
      - ./Feed/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://user:password%40123@postgres_db:5432/feed_db?sslmode=disable", "up"]
    networks:
      - bozena_network

  notification-migration:
    image: migrate/migrate:v4.17.0  
    depends_on:
      postgres:
        condition: service_healthy 
    volumes:
      - ./notification/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://user:password%40123@postgres_db:5432/notification_db?sslmode=disable", "up"]
    networks:
      - bozena_network
  # ---------------- Microservices ----------------
  auth-service:
    build:
      context: .
      args:
        - SERVICE_NAME=Auth
        - MAIN_PATH=cmd/main.go
    container_name: auth_service
    depends_on:
      postgres:
        condition: service_healthy 
      auth-migration:
        condition: service_completed_successfully 
      redis:
        condition: service_started
      kafka:
         condition: service_healthy 
      minio:
        condition: service_started
    environment:
      - DB_URL=postgres://user:password%40123@postgres_db:5432/user_db?sslmode=disable
      - REDIS_URL=redis:6379
      - KAFKA_BROKERS_URL=kafka:29092
      - MINIO_URL=minio:9000
      - GRPC_PORT=50052
    networks:
      - bozena_network

  post-service:
    build:
      context: .
      args:
        - SERVICE_NAME=post
        - MAIN_PATH=cmd/main.go
    container_name: post_service
    depends_on:
      postgres:
        condition: service_healthy 
      post-migration:
        condition: service_completed_successfully 
      redis:
        condition: service_started
      kafka:
         condition: service_healthy
      minio:
        condition: service_started
      
    environment:
      - DB_URL=postgres://user:password%40123@postgres_db:5432/post_db?sslmode=disable
      - KAFKA_BROKERS_URL=kafka:29092
      - MINIO_URL=minio:9000
      - GRPC_PORT=50051
    networks:
      - bozena_network

  like-service:
    build:
      context: .
      args:
        - SERVICE_NAME=like
        - MAIN_PATH=cmd/main.go
    container_name: like_service
    depends_on:
      postgres:
        condition: service_healthy 
      like-migration:
        condition: service_completed_successfully 
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      - DB_URL=postgres://user:password%40123@postgres_db:5432/like_db?sslmode=disable
      - KAFKA_BROKERS_URL=kafka:29092
      - GRPC_PORT=50053
    networks:
      - bozena_network

  follow-service:
    build:
      context: .
      args:
        - SERVICE_NAME=follow
        - MAIN_PATH=cmd/main.go
    container_name: follow_service
    depends_on:
      postgres:
        condition: service_healthy 
      follow-migration:
        condition: service_completed_successfully 
      redis:
        condition: service_started
      kafka:
         condition: service_healthy 
    environment:
      - DB_URL=postgres://user:password%40123@postgres_db:5432/follow_db?sslmode=disable
      - KAFKA_BROKERS_URL=kafka:29092
      - REDIS_URL=redis:6379
      - GRPC_PORT=50054
    networks:
      - bozena_network

  feed-service:
    build:
      context: .
      args:
        - SERVICE_NAME=Feed
        - MAIN_PATH=cmd/main.go
    container_name: feed_service
    depends_on:
      postgres:
        condition: service_healthy 
      feed-migration:
        condition: service_completed_successfully 
      redis:
        condition: service_started
      kafka:
         condition: service_healthy 
    environment:
      - DB_URL=postgres://user:password%40123@postgres_db:5432/feed_db?sslmode=disable
      - KAFKA_BROKERS_URL=kafka:29092
      - MINIO_URL=minio:9000
      - FOLLOW_SERVICE_URL=follow-service:50054
      - GRPC_PORT=50055
    networks:
      - bozena_network
  

  notification-service:
    build:
      context: .
      args:
        - SERVICE_NAME=notification
        - MAIN_PATH=cmd/main.go
    container_name: notification-service
    depends_on:
      postgres:
        condition: service_healthy 
      notification-migration:
        condition: service_completed_successfully 
      redis:
        condition: service_started
      kafka:
         condition: service_healthy 
    environment:
      - DB_URL=postgres://user:password%40123@postgres_db:5432/notification_db?sslmode=disable
      - KAFKA_BROKERS_URL=kafka:29092
      - SERVER_PORT=8083
    networks:
      - bozena_network


  chat-service:
    build:
      context: .
      args:
        - SERVICE_NAME=Chat
        - MAIN_PATH=cmd/main.go
    container_name: chat-service
    depends_on:
      kafka:
         condition: service_healthy 
      mongodb:
        condition: service_started
   
      minio:
        condition: service_started
    environment:
      - DB_URL=mongodb://mongodb_db:27017/
      - KAFKA_BROKERS_URL=kafka:29092
      - MINIO_URL=minio:9000
      - SERVER_PORT=8084
    networks:
      - bozena_network


   

  api-gateway:
    build:
      context: .
      args:
        - SERVICE_NAME=APIGateway
        - MAIN_PATH=cmd/gateway/main.go
    container_name: api_gateway
    depends_on:
      - auth-service
      - post-service
      - like-service
      - follow-service
      - feed-service
      - redis
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
      - AUTH_SERVICE_URL=auth-service:50052
      - POST_SERVICE_URL=post-service:50051
      - LIKE_SERVICE_URL=like-service:50053
      - FOLLOW_SERVICE_URL=follow-service:50054
      - FEED_SERVICE_URL=feed-service:50055
      - NOTIFICATION_SERVICE_URL=notification-service:8083
      - CHAT_SERVICE_URL=chat-service:8084
      - SERVER_PORT=8080
    networks:
      - bozena_network

networks:
  bozena_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  minio_data:
